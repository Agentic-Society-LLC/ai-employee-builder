name: secret-scan

# Non-blocking secret scan (gitleaks CLI, no license needed).
# Scans only the commits in each push / PR, prints findings REDACTED, and never
# fails the job: a hit shows up as a warning annotation plus a job summary.
# Not a required check. Pinned: checkout by commit SHA, gitleaks by version + SHA-256.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gl.tgz gitleaks

      - name: Scan new commits (redacted, non-blocking)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ -n "$BASE" ]; then RANGE="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="-1 $HEAD_SHA"; fi
          echo "Scanning: $RANGE"
          if gitleaks git . --redact --no-banner --log-opts="$RANGE" --exit-code 1; then
            echo "### secret-scan: clean ($RANGE)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=gitleaks::Possible secret in $RANGE. Values are redacted; see this job log. Rotate before anything else."
            echo "### secret-scan: possible secret in $RANGE (redacted, see log)" >> "$GITHUB_STEP_SUMMARY"
          fi
